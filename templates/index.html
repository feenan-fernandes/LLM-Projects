<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swarm IDE</title>
    <!-- Tailwind CSS -->
    <script src="/static/js/tailwindcss.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: { 900: '#0d1117', 800: '#161b22', 700: '#21262d', 600: '#30363d', 400: '#8b949e', 300: '#c9d1d9' },
                        blue: { 500: '#58a6ff' }
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script src="/static/js/react.development.js"></script>
    <script src="/static/js/react-dom.development.js"></script>
    <!-- Babel for in-browser JSX -->
    <script src="/static/js/babel.min.js"></script>
    <!-- Marked.js -->
    <script src="/static/js/marked.min.js"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; overflow: hidden; }
        .markdown p { margin-bottom: 0.75rem; }
        .markdown pre { background: #161b22; padding: 1rem; border-radius: 0.375rem; border: 1px solid #30363d; margin: 0.75rem 0; overflow-x: auto; }
        .markdown code { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; font-size: 0.85em; }
        .markdown pre code { font-size: 0.85rem; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #8b949e; }
        .loader { border: 2px solid #30363d; border-top: 2px solid #58a6ff; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        {% raw %}
        const { useState, useEffect, useRef } = React;

        const RichMessage = ({ content }) => {
            const thinkRegex = /<think>([\s\S]*?)<\/think>/g;
            let thoughts = [];
            let match;
            while ((match = thinkRegex.exec(content)) !== null) {
                thoughts.push(match[1].trim());
            }
            
            let cleanContent = content.replace(thinkRegex, '');
            
            const toolRegex = /<(execute_bash|write_file|patch_file|replace_block)[\s\S]*?>([\s\S]*?)<\/\1>/g;
            let tools = [];
            while ((match = toolRegex.exec(cleanContent)) !== null) {
                tools.push({ type: match[1], body: match[2].trim() });
            }
            cleanContent = cleanContent.replace(toolRegex, '');

            return (
                <div className="flex flex-col gap-3">
                    {thoughts.map((t, idx) => (
                        <details key={idx} className="group border border-gray-600 rounded-md bg-gray-800 overflow-hidden cursor-pointer">
                            <summary className="px-3 py-2 text-xs font-semibold text-gray-400 select-none hover:text-gray-300">
                                [+] Agent Reasoning (Chain of Thought)
                            </summary>
                            <div className="px-3 py-2 text-sm text-gray-400 border-t border-gray-600 cursor-text whitespace-pre-wrap">
                                {t}
                            </div>
                        </details>
                    ))}

                    {cleanContent.trim() && (
                        <div className="markdown text-sm text-gray-300" dangerouslySetInnerHTML={{ __html: marked.parse(cleanContent) }} />
                    )}

                    {tools.map((t, idx) => (
                        <div key={idx} className="border border-blue-500/30 bg-blue-500/5 rounded-md p-3 flex flex-col gap-2">
                            <div className="flex items-center gap-2 text-blue-400 text-xs font-bold uppercase tracking-wider">
                                <span>🛠️</span> {t.type.replace('_', ' ')}
                            </div>
                            <pre className="text-xs text-gray-300 whitespace-pre-wrap max-h-32 overflow-y-auto">{t.body}</pre>
                        </div>
                    ))}
                </div>
            );
        };

        const App = () => {
            const [sessions, setSessions] = useState(() => JSON.parse(localStorage.getItem('swarmV2Sessions') || '[]'));
            const [currentSessionId, setCurrentSessionId] = useState(() => localStorage.getItem('swarmV2SessionId') || Date.now().toString());
            const [history, setHistory] = useState(() => JSON.parse(localStorage.getItem('swarmV2History') || '[]'));
            const [input, setInput] = useState('');
            const [files, setFiles] = useState([]);
            const [isStreaming, setIsStreaming] = useState(false);
            const [abortController, setAbortController] = useState(null);
                        const [uncensored, setUncensored] = useState(false);
            const [showGovernance, setShowGovernance] = useState(false);
            const [govData, setGovData] = useState(null);

            useEffect(() => {
                if(showGovernance && !govData) {
                    fetch('/governance_stats')
                        .then(r => r.json())
                        .then(d => setGovData(d))
                        .catch(e => console.error(e));
                }
            }, [showGovernance]);
            const messagesEndRef = useRef(null);

            useEffect(() => {
                // Auto-cleanup duplicate sessions by title
                setSessions(prev => {
                    const unique = [];
                    const seen = new Set();
                    for (const s of prev) {
                        if (!seen.has(s.title)) {
                            seen.add(s.title);
                            unique.push(s);
                        }
                    }
                    if (unique.length !== prev.length) {
                        localStorage.setItem('swarmV2Sessions', JSON.stringify(unique));
                        return unique;
                    }
                    return prev;
                });
            }, []);

            useEffect(() => {
                localStorage.setItem('swarmV2History', JSON.stringify(history));
                localStorage.setItem('swarmV2SessionId', currentSessionId);
                
                // Auto-save session
                if (history.length > 0) {
                    setSessions(prev => {
                        const existing = prev.findIndex(s => s.id === currentSessionId);
                        const title = history.find(h => h.role === 'user')?.content.substring(0, 30) + '...' || 'New Chat';
                        const newSessions = [...prev];
                        if (existing >= 0) {
                            newSessions[existing].history = history;
                        } else {
                            newSessions.unshift({ id: currentSessionId, title, history, date: new Date().toISOString() });
                        }
                        return newSessions;
                    });
                }
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [history]);

            useEffect(() => {
                localStorage.setItem('swarmV2Sessions', JSON.stringify(sessions));
            }, [sessions]);

            const deleteSession = (e, id) => {
                e.stopPropagation();
                setSessions(prev => prev.filter(s => s.id !== id));
                if (currentSessionId === id) {
                    setHistory([]);
                    setCurrentSessionId(Date.now().toString());
                }
            };

            const startNewChat = () => {
                setHistory([]);
                setCurrentSessionId(Date.now().toString());
                setInput('');
            };

            const loadSession = (session) => {
                setHistory(session.history || []);
                setCurrentSessionId(session.id);
            };

            const handleFileSelect = (e) => {
                const selected = e.target.files;
                for (let i=0; i<selected.length; i++) {
                    const file = selected[i];
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        setFiles(prev => [...prev, { name: file.name, content: evt.target.result }]);
                    };
                    reader.readAsDataURL(file);
                }
                e.target.value = '';
            };

            const removeFile = (idx) => {
                setFiles(prev => prev.filter((_, i) => i !== idx));
            };

            const handleSubmit = async (e) => {
                if(e) e.preventDefault();
                if (!input.trim() && files.length === 0) return;

                if (input.trim() === '/clear') {
                    setHistory([]);
                    setInput('');
                    return;
                }

                const userMsg = input.trim();
                const attached = [...files];
                
                setHistory(prev => [...prev, { role: 'user', content: userMsg, attached }]);
                setInput('');
                setFiles([]);
                setIsStreaming(true);

                setHistory(prev => [...prev, { role: 'assistant', content: '', isStreaming: true }]);

                try {
                    const controller = new AbortController();
                    setAbortController(controller);
                    const res = await fetch('/build', {
                        signal: controller.signal,
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            prompt: userMsg, 
                            files: attached, 
                            uncensored: uncensored, 
                            history: history.slice(-6).map(h => ({ role: h.role, content: h.content }))
                        })
                    });

                    const reader = res.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = "";

                    while (true) {
                        const {value, done} = await reader.read();
                        if (done) break;
                        
                        buffer += decoder.decode(value, {stream: true});
                        const lines = buffer.split('\n');
                        buffer = lines.pop();

                        for (const line of lines) {
                            if (!line.trim()) continue;
                            try {
                                const chunk = JSON.parse(line);
                                if (chunk.type === 'stream' && chunk.chunk) {
                                    setHistory(prev => {
                                        const newHistory = [...prev];
                                        const lastMsg = { ...newHistory[newHistory.length - 1] };
                                        lastMsg.content += chunk.chunk;
                                        newHistory[newHistory.length - 1] = lastMsg;
                                        return newHistory;
                                    });
                                } else if (chunk.type === 'finish') {
                                    setSessions(prev => {
                                        const newSessions = [...prev];
                                        const idx = newSessions.findIndex(s => s.id === currentSessionId);
                                        if (idx !== -1 && chunk.metrics) {
                                            newSessions[idx].metrics = chunk.metrics;
                                        }
                                        return newSessions;
                                    });
                                } else if (chunk.type === 'action') {
                                    setHistory(prev => {
                                        const newHistory = [...prev];
                                        const lastMsg = newHistory[newHistory.length - 1];
                                        lastMsg.content += `\n\n> **[OVERLORD]** ${chunk.action}: \n> \`\`\`\n> ${chunk.result}\n> \`\`\`\n\n`;
                                        return newHistory;
                                    });
                                }
                            } catch(err) {}
                        }
                    }
                } catch(err) {
                    if (err.name === 'AbortError') {
                        setHistory(prev => {
                            const newHistory = [...prev];
                            newHistory[newHistory.length - 1].content += "\n\n⚠️ **Generation stopped by user.**";
                            return newHistory;
                        });
                    } else {
                        console.error('Fetch error:', err);
                        setHistory(prev => {
                            const newHistory = [...prev];
                            newHistory[newHistory.length - 1].content = "⚠️ Connection error to backend.";
                            return newHistory;
                        });
                    }
                } finally {
                    setAbortController(null);
                    setIsStreaming(false);
                    setHistory(prev => {
                        const newHistory = [...prev];
                        if (newHistory[newHistory.length - 1]) {
                            newHistory[newHistory.length - 1].isStreaming = false;
                        }
                        return newHistory;
                    });
                }
            };

            return (
                <div className="flex h-screen bg-gray-900 text-gray-300">
                    {/* Left Sidebar */}
                    <div className="w-64 border-r border-gray-700 bg-gray-800 flex flex-col">
                        <div className="p-4 border-b border-gray-700 flex items-center gap-2 font-bold text-white tracking-wider">
                            <span className="text-blue-500">⚡</span> Swarm IDE 
                        </div>
                        
                        <div className="flex-1 overflow-y-auto flex flex-col">
                            <div className="p-4">
                                <div className="text-xs font-semibold text-gray-500 uppercase tracking-widest mb-3">Settings</div>
                                <label className="flex items-center gap-2 text-sm cursor-pointer hover:text-white transition">
                                    <input type="checkbox" checked={uncensored} onChange={(e) => setUncensored(e.target.checked)} className="accent-red-500" />
                                    Heretic Mode (Uncensored)
                                </label>
                            </div>
                            
                                                        <div className="mt-4 px-4">
                                <button onClick={() => setShowGovernance(true)} className="w-full py-2 bg-gray-800 border border-gray-600 hover:bg-gray-700 text-gray-300 rounded text-xs transition font-semibold shadow-sm flex items-center justify-center gap-2">
                                    <span>🛡️</span> Governance Log
                                </button>
                            </div>
                            
                            <div className="px-4 pb-2">
                                <div className="text-xs font-semibold text-gray-500 uppercase tracking-widest mb-3 mt-4">Sessions</div>
                                <div className="flex flex-col gap-1 overflow-y-auto max-h-64">
                                    {sessions.length === 0 ? <div className="text-xs text-gray-600">No recent chats</div> : 
                                        sessions.map(s => (
                                            <div 
                                                key={s.id} 
                                                onClick={() => loadSession(s)}
                                                className={`group flex items-center justify-between text-sm cursor-pointer py-1.5 px-2 rounded ${currentSessionId === s.id ? 'bg-blue-600/20 text-blue-400' : 'hover:bg-gray-700 text-gray-400 hover:text-white'}`}
                                            >
                                                <div className="flex flex-col min-w-0 w-full">
                                                    <span className="truncate pr-2">{s.title}</span>
                                                    {s.metrics && <span className="text-[10px] text-gray-500 truncate mt-0.5">? {s.metrics.peak_tps} t/s | ?? {s.metrics.total_tokens}</span>}
                                                </div>
                                                <button 
                                                    onClick={(e) => deleteSession(e, s.id)}
                                                    className="text-gray-500 hover:text-red-400 text-lg leading-none px-1 rounded hover:bg-red-400/10 transition flex-shrink-0"
                                                    title="Delete Session"
                                                >
                                                    &times;
                                                </button>
                                            </div>
                                        ))
                                    }
                                </div>
                            </div>
                            <div className="mt-auto p-4 border-t border-gray-700">
                                <button onClick={startNewChat} className="w-full py-2 bg-blue-600 hover:bg-blue-500 text-white rounded text-sm transition font-medium shadow">
                                    + New Workspace Chat
                                </button>
                            </div>
                        </div>
                    </div>

                                        {/* Center Canvas */}

                    {/* Governance Modal */}
                    {showGovernance && (
                        <div className="absolute inset-0 z-50 bg-black/80 flex items-center justify-center backdrop-blur-sm">
                            <div className="bg-gray-800 border border-gray-600 rounded-xl p-6 shadow-2xl w-full max-w-lg">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-xl font-bold text-white flex items-center gap-2">
                                        <span>🛡️</span> Swarm Governance
                                    </h3>
                                    <button onClick={() => setShowGovernance(false)} className="text-gray-400 hover:text-white text-2xl leading-none">&times;</button>
                                </div>
                                {govData ? (
                                    <div className="space-y-4">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="bg-gray-900 rounded p-4 border border-gray-700">
                                                <div className="text-xs text-gray-500 uppercase font-bold">Total Sessions</div>
                                                <div className="text-2xl text-blue-400 font-medium">{govData.total_sessions}</div>
                                            </div>
                                            <div className="bg-gray-900 rounded p-4 border border-gray-700">
                                                <div className="text-xs text-gray-500 uppercase font-bold">Total Actions</div>
                                                <div className="text-2xl text-green-400 font-medium">{govData.total_actions}</div>
                                            </div>
                                            <div className="bg-gray-900 rounded p-4 border border-gray-700">
                                                <div className="text-xs text-gray-500 uppercase font-bold">Heretic Sessions</div>
                                                <div className="text-2xl text-red-400 font-medium">{govData.uncensored_sessions}</div>
                                            </div>
                                            <div className="bg-gray-900 rounded p-4 border border-gray-700">
                                                <div className="text-xs text-gray-500 uppercase font-bold">Models Used</div>
                                                <div className="text-sm text-gray-300 font-medium mt-1">
                                                    {Object.entries(govData.models_used || {}).map(([k,v]) => (
                                                        <div key={k}>{k}: {v}</div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                        <div className="text-xs text-gray-500 mt-4 text-center">
                                            Logs are permanently written to local SQLite database: workspace/governance.db
                                        </div>
                                    </div>
                                ) : (
                                    <div className="flex justify-center p-8"><div className="loader"></div></div>
                                )}
                            </div>
                        </div>
                    )}
                    <div className="flex-1 flex flex-col relative">
                        {/* Messages */}
                        <div className="flex-1 overflow-y-auto p-4 md:p-8 scroll-smooth">
                            {history.length === 0 ? (
                                <div className="h-full flex flex-col items-center justify-center text-gray-500">
                                    <div className="text-4xl mb-4">⚛️</div>
                                    <h2 className="text-xl font-medium text-gray-300 mb-2">Welcome to Swarm IDE</h2>
                                    <p className="max-w-md text-center text-sm">Powered by React, Tailwind, and completely decoupled UI architecture. Attach files, write code, and watch agents execute in isolated Docker containers.</p>
                                </div>
                            ) : (
                                <div className="max-w-4xl mx-auto flex flex-col gap-6">
                                    {history.map((msg, idx) => (
                                        <div key={idx} className={`flex gap-4 ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                            {msg.role === 'assistant' && <div className="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center shrink-0 shadow border border-blue-500 text-white"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"></path><path d="M13 19l6-6"></path><path d="M16 16l4 4"></path><path d="M19 21l2-2"></path><path d="M14.5 14.5L19 10l-4.5-4.5L10 10"></path></svg></div>}
                                            <div className={`max-w-[85%] rounded-xl p-4 shadow-sm ${msg.role === 'user' ? 'bg-gray-800 border border-gray-700' : 'bg-transparent border-l-2 border-blue-500'}`}>
                                                {msg.role === 'user' ? (
                                                    <div className="text-sm text-gray-300 whitespace-pre-wrap">
                                                        {msg.content}
                                                        {msg.attached && msg.attached.length > 0 && (
                                                            <div className="mt-3 flex gap-2 flex-wrap">
                                                                {msg.attached.map((f, i) => (
                                                                    <div key={i} className="text-xs bg-gray-900 border border-gray-700 rounded px-2 py-1 flex items-center gap-1">
                                                                        📄 {f.name}
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </div>
                                                ) : (
                                                    <div className="flex flex-col gap-2 w-full">
                                                        {msg.content ? <RichMessage content={msg.content} /> : ((isStreaming && idx === history.length - 1) ? <div className="loader"></div> : <span className="text-red-400 italic text-sm">⚠️ Connection dropped. Empty response.</span>)}
                                                    </div>
                                                )}
                                            </div>
                                            {msg.role === 'user' && <div className="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center shrink-0 border border-gray-600">👤</div>}
                                        </div>
                                    ))}
                                    <div ref={messagesEndRef} />
                                </div>
                            )}
                        </div>

                        {/* Input Area */}
                        <div className="p-4 border-t border-gray-700 bg-gray-900/90 backdrop-blur">
                            <div className="max-w-4xl mx-auto flex flex-col gap-2">
                                {/* Attached Files Pills */}
                                {files.length > 0 && (
                                    <div className="flex gap-2 flex-wrap px-2">
                                        {files.map((f, idx) => (
                                            <div key={idx} className="bg-blue-500/10 border border-blue-500/30 text-blue-400 text-xs px-2 py-1 rounded-full flex items-center gap-2 shadow-sm">
                                                📄 {f.name}
                                                <button onClick={() => removeFile(idx)} className="hover:text-white font-bold">&times;</button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                
                                <form onSubmit={handleSubmit} className="relative">
                                    <textarea 
                                        value={input}
                                        onChange={(e) => setInput(e.target.value)}
                                        onKeyDown={(e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSubmit(); } }}
                                        placeholder="Command your Swarm... (Press Enter to send, Shift+Enter for new line)"
                                        className="w-full bg-gray-800 border border-gray-700 rounded-xl pl-4 pr-24 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 resize-none overflow-y-auto max-h-32 shadow-inner transition placeholder-gray-500 text-gray-200"
                                        rows="2"
                                    />
                                    <div className="absolute right-2 bottom-3 flex items-center gap-1">
                                        <label className="cursor-pointer p-2 text-gray-400 hover:text-white hover:bg-gray-700 rounded transition">
                                            <input type="file" multiple onChange={handleFileSelect} className="hidden" />
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                                        </label>
                                        {isStreaming ? (
                                            <button 
                                                type="button" 
                                                onClick={() => abortController && abortController.abort()}
                                                className="p-2 bg-red-600 text-white rounded hover:bg-red-500 transition shadow flex items-center justify-center gap-1 text-xs font-bold"
                                                title="Stop Generation"
                                            >
                                                ■ Stop
                                            </button>
                                        ) : (
                                            <button 
                                                type="submit" 
                                                disabled={!input.trim() && files.length === 0}
                                                className="p-2 bg-blue-600 text-white rounded hover:bg-blue-500 disabled:opacity-50 disabled:cursor-not-allowed transition shadow"
                                            >
                                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                                            </button>
                                        )}
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        {% endraw %}
    </script>
</body>
</html>
